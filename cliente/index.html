<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacientes da Nutricionista</title>
</head>

<body>
    <center>
        <h1>Calcular o Imc</h1>
        <form action="http://127.0.0.1:3000" method="post">
            <input type="number" placeholder="Identidade" name="peso" step="0.01" min="0" required><br><br>
            <input type="number" placeholder="Número do paciente" name="peso" step="0.01" min="0" required><br><br>
            <input type="text" placeholder="Nome" name="nome" required><br><br>
<input type="number" placeholder="Peso em kg (ex: 70.5)" name="peso" step="0.01" min="0" required><br><br>
<input type="number" placeholder="Altura em metros (ex: 1.75)" name="altura" step="0.01" min="0" required><br><br>
<button type="reset">Limpar</button>
<button type="submit">Calcular IMC</button>
        </form>
    </center>
</body>

</html>
